name: Build Donezo deployment artifact

on:
  push:
    branches:
      - feat/mobile-social-proof-polish-2026-08-31
    paths:
      - .github/workflows/build-vercel-artifact.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://kiqntckwcqxkxgpuajyi.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UIFTVZHt2R76o6GrG_zDKw_4FOQHl7T
      - uses: actions/upload-artifact@v4
        with:
          name: donezo-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
