name: Apply habit management transforms

on:
  push:
    branches: [feat/habit-management]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/habit-management
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-habit-repository.mjs
      - run: node scripts/apply-habit-ui.mjs
      - run: node --check src/store.js
      - run: node --check src/app.js
      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo "No product changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store.js src/app.js social.css
          git commit -m "feat: complete habit lifecycle management"
          git push origin HEAD:feat/habit-management
