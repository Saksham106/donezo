name: Apply camera Friends stability

on:
  push:
    branches:
      - fix/camera-friends-stability-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_camera_friends_stability.py
      - run: npm ci
      - run: node --test test/camera-friends-stability.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified stability fixes
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm -f scripts/patch_camera_friends_stability.py .github/workflows/apply-camera-friends-stability.yml
          git add src/app.js social.css test/camera-friends-stability.test.mjs test/photo-camera-friends-polish.test.mjs test/dual-updates-polish.test.mjs
          git commit -m "fix: stabilize camera and Friends feed"
          git push origin HEAD
