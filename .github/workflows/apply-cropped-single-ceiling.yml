name: Apply cropped single ceiling
on:
  push:
    branches: [feat/proof-friends-polish-2026-09-02]
    paths: [.github/workflows/apply-cropped-single-ceiling.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/proof-friends-polish-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_cropped_single_ceiling.py
      - run: npm ci
      - run: node --test test/proof-crop-ui.test.mjs test/proof-crop.test.mjs test/proof.test.mjs test/dual-proof.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified cropped proof ceiling fix
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm scripts/patch_cropped_single_ceiling.py .github/workflows/apply-cropped-single-ceiling.yml
          git add src/app.js test/proof-crop-ui.test.mjs
          git commit -m "fix: keep cropped proofs upload-safe [crop-ceiling-applied]"
          git push origin HEAD:feat/proof-friends-polish-2026-09-02
