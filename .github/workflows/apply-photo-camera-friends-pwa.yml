name: Apply photo camera Friends polish

on:
  push:
    branches:
      - fix/photo-camera-friends-pwa-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_photo_camera_friends_pwa.py
      - run: npm ci
      - run: node --test test/photo-camera-friends-polish.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified camera polish
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm -f scripts/patch_photo_camera_friends_pwa.py .github/workflows/apply-photo-camera-friends-pwa.yml
          git add src/app.js src/store.js src/proof.js src/dual-proof.js social.css supabase/migrations/20260902_photo_camera_mode_cleanup.sql test/photo-camera-friends-polish.test.mjs test/dual-proof-mode.test.mjs test/dual-proof-ui.test.mjs test/dual-updates-polish.test.mjs test/friends-ui.test.mjs
          git commit -m "fix: unify photo camera and compact Friends"
          git push origin HEAD
