name: Apply friend request cancellation
on:
  push:
    branches: [feat/proof-friends-polish-2026-09-02]
    paths: [.github/workflows/apply-friend-request-cancel.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/proof-friends-polish-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_friend_request_cancel.py
      - run: npm ci
      - run: node --test test/friend-request-cancel.test.mjs test/friends-audiences.test.mjs test/searchable-people.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified cancellation support
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm scripts/patch_friend_request_cancel.py .github/workflows/apply-friend-request-cancel.yml
          git add src/store.js supabase/migrations test
          git commit -m "feat: cancel outgoing friend requests [friend-cancel-applied]"
          git push origin HEAD:feat/proof-friends-polish-2026-09-02
      # rerun after tightening the memory-method patch guard
