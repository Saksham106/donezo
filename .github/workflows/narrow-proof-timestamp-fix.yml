name: Narrow proof timestamp fix

on:
  push:
    branches:
      - fix/proof-rejections-timestamps-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Keep exact timestamps scoped to proof posts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app.js')
          text = path.read_text()

          replacements = [
              (
                  '${esc(`${formatWhen(activity.when)} · ${formatExactTime(activity.when)}`)} · visible to this group',
                  '${esc(formatWhen(activity.when))} · visible to this group',
              ),
              (
                  "activityProfileButton(activity.userId, `${mine ? 'You' : esc(actor?.name || 'Friend')} ${verb}`, esc(`${formatWhen(activity.when)} · ${formatExactTime(activity.when)}`))",
                  "activityProfileButton(activity.userId, `${mine ? 'You' : esc(actor?.name || 'Friend')} ${verb}`, esc(formatWhen(activity.when)))",
              ),
              (
                  '${esc(`${formatWhen(activity.when)} · ${formatExactTime(activity.when)}`)} · 🔥 ${activity.streak}',
                  '${esc(formatWhen(activity.when))} · 🔥 ${activity.streak}',
              ),
              (
                  '${esc(activity.emoji || \'✓\')} ${esc(activity.habitTitle)} · ${esc(`${formatWhen(activity.when)} · ${formatExactTime(activity.when)}`)}',
                  '${esc(activity.emoji || \'✓\')} ${esc(activity.habitTitle)} · ${esc(formatWhen(activity.when))}',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              expected = 2 if "activity.emoji || '✓'" in old else 1
              if count != expected:
                  raise SystemExit(f'expected {expected} matches, found {count}: {old[:120]!r}')
              text = text.replace(old, new)

          proof_stamp = '<span>· ${esc(`${formatWhen(activity.when)} · ${formatExactTime(activity.when)}`)}</span>'
          if text.count(proof_stamp) != 1:
              raise SystemExit('proof exact timestamp was not preserved exactly once')

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified cleanup and remove workflow
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm .github/workflows/narrow-proof-timestamp-fix.yml
          git add src/app.js
          git diff --cached --check
          git commit -m "refine: keep exact timestamps on proof posts"
          git push origin HEAD:fix/proof-rejections-timestamps-2026-09-02
