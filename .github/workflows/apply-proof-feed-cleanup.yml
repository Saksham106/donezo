name: Apply proof feed cleanup

on:
  push:
    branches:
      - fix/proof-comment-profile-cleanup-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch approved proof feed cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          app = 'src/app.js'
          replace_once(app,
              ": reactionTotal ? `${reactionTotal} ${reactionTotal === 1 ? 'reaction' : 'reactions'}` : 'Be the first to hype this';",
              ": reactionTotal ? `${reactionTotal} ${reactionTotal === 1 ? 'reaction' : 'reactions'}` : '';"
          )
          replace_once(app,
              '<small class="reaction-summary" aria-live="polite">${esc(reactionSummary)}</small>',
              '${reactionSummary ? `<small class="reaction-summary" aria-live="polite">${esc(reactionSummary)}</small>` : \'\'}'
          )
          replace_once(app,
              '  const recent = activityList(state).filter((item) => item.userId === person.id);\n  const score = weeklyCompletionScore(person.id, state.habits, state.checkIns, today());',
              '  const recent = activityList(state).filter((item) => item.userId === person.id);\n  const otherActivity = recent.filter((item) => !item.proofPath);\n  const score = weeklyCompletionScore(person.id, state.habits, state.checkIns, today());'
          )
          replace_once(app,
              '<section class="profile-recent"><strong>All activity</strong><div class="profile-activity-list">${recent.length ? recent.map((item) => activityCard(item, { showProofActions: Boolean(item.proofPath) })).join(\'\') : \'<p>No updates yet.</p>\'}</div></section>',
              '<section class="profile-recent"><strong>Other activity</strong><div class="profile-activity-list">${otherActivity.length ? otherActivity.map((item) => activityCard(item)).join(\'\') : \'<p>No other activity yet.</p>\'}</div></section>'
          )

          css = 'social.css'
          replace_once(css,
              '.proof-reply-preview{display:grid;gap:.38rem;',
              '.proof-reply-preview{display:grid;gap:.18rem;'
          )
          replace_once(css,
              '.proof-reply-author,.proof-reply-all{min-height:0;border:0;',
              '.proof-reply-author,.proof-reply-all{min-height:0!important;border:0;'
          )
          PY
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified cleanup and remove workflow
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm .github/workflows/apply-proof-feed-cleanup.yml
          git add src/app.js social.css test/proof-feed-cleanup.test.mjs
          git diff --cached --check
          git commit -m "fix: tighten proof replies and profile activity"
          git push origin HEAD:fix/proof-comment-profile-cleanup-2026-09-02
