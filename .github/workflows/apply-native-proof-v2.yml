name: Apply native proof v2
on:
  push:
    branches: [feat/proof-friends-polish-2026-09-02]
    paths: [.github/workflows/apply-native-proof-v2.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/proof-friends-polish-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_native_proof_v2.py
      - run: npm ci
      - run: node --test test/native-proof-flow-v2.test.mjs test/dual-proof.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified native proof flow
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm scripts/patch_native_proof_v2.py .github/workflows/apply-native-proof-v2.yml
          git add src/app.js src/dual-proof.js social.css test
          git commit -m "feat: simplify native proof capture [native-proof-v2-applied]"
          git push origin HEAD:feat/proof-friends-polish-2026-09-02
