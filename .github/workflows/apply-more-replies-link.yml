name: Apply More replies link

on:
  push:
    branches:
      - fix/proof-replies-more-link-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch approved More replies link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/app.js',
              '? `<button class="proof-reply-all" type="button" data-comment-open="${checkInId}">View all ${comments.length} replies</button>`',
              '? `<button class="proof-reply-all" type="button" data-comment-open="${checkInId}" aria-label="View all ${comments.length} replies">More</button>`',
          )

          replace_once(
              'social.css',
              '.proof-reply-all{margin-top:.15rem;color:var(--color-muted);font-weight:700}',
              '.proof-reply-all{margin-top:.15rem;color:var(--color-cobalt);font-size:var(--text-2xs);font-weight:700}',
          )
          PY
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified More-link change and remove workflow
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm .github/workflows/apply-more-replies-link.yml
          git add src/app.js social.css
          git diff --cached --check
          git commit -m "fix: simplify hidden replies link"
          git push origin HEAD:fix/proof-replies-more-link-2026-09-02
