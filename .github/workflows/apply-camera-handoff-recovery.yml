name: Apply camera handoff recovery

on:
  push:
    branches:
      - fix/photo-camera-friends-pwa-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_camera_handoff_recovery.py
      - run: npm ci
      - run: node --test test/photo-camera-friends-polish.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified handoff recovery
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm -f scripts/patch_camera_handoff_recovery.py .github/workflows/apply-camera-handoff-recovery.yml
          git add src/app.js
          git commit -m "fix: recover Donezo camera after native handoff"
          git push origin HEAD
