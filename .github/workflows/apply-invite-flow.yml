name: Apply invite flow patch

on:
  push:
    branches: [feat/invite-flow]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/invite-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/run-invite-patch.mjs
      - name: Commit transformed source
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js social.css package.json
          git commit -m "chore: apply invite flow source changes"
          git push origin HEAD:feat/invite-flow
