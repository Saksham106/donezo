name: Finalize notification shell v27
on:
  push:
    paths:
      - '.github/workflows/patch-today-undo-notifications.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/today-undo-confirm-notifications-2026-08-31
      - name: Advance shell cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            'sw.js',
            'test/final-social-polish.test.mjs',
            'test/pwa.test.mjs',
            'test/mobile-social-proof-polish.test.mjs',
            'test/app-shell.test.mjs',
            'test/fluid-performance.test.mjs',
          ]
          for name in files:
            p = Path(name)
            s = p.read_text()
            if 'donezo-shell-v26' not in s:
              raise SystemExit(f'missing v26 reference in {name}')
            s = s.replace('donezo-shell-v26', 'donezo-shell-v27')
            if name == 'test/fluid-performance.test.mjs':
              s = s.replace('advances to v26', 'advances to v27')
            p.write_text(s)
          PY
          git rm .github/workflows/patch-today-undo-notifications.yml
      - name: Verify clean product tree
        run: |
          npm ci
          npm test
          npm run check
          VITE_SUPABASE_URL=https://example.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_only npm run build
          git diff --check
      - name: Commit final product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js test .github/workflows/patch-today-undo-notifications.yml
          git commit -m 'chore: advance Donezo shell to v27'
          git push origin HEAD:fix/today-undo-confirm-notifications-2026-08-31
