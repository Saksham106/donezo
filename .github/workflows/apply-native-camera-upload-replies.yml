name: Apply native camera upload replies

on:
  push:
    branches:
      - fix/native-camera-upload-replies-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_native_camera_upload_replies.py
      - run: python3 scripts/patch_native_camera_edge_cases.py
      - run: python3 scripts/restore_fluid_performance_test.py
      - run: npm ci
      - run: node --test test/native-camera-upload-replies.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified bounded fixes
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm -f scripts/patch_native_camera_upload_replies.py scripts/patch_native_camera_edge_cases.py scripts/restore_fluid_performance_test.py .github/workflows/apply-native-camera-upload-replies.yml
          git add src/app.js supabase/migrations/20260902_fix_selected_friend_proof_snapshot.sql test/native-camera-upload-replies.test.mjs test/fluid-performance.test.mjs
          git commit -m "fix: native camera upload and reply stability"
          git push origin HEAD
