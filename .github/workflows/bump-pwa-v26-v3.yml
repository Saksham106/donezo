name: Bump PWA shell v26 v3
on:
  push:
    paths:
      - '.github/workflows/bump-pwa-v26-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flexible-weekly-habits-dark-mode-2026-08-31
      - name: Bump exact shell references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
            Path('sw.js'),
            Path('test/app-shell.test.mjs'),
            Path('test/mobile-social-proof-polish.test.mjs'),
            Path('test/final-social-polish.test.mjs'),
            Path('test/pwa.test.mjs'),
          ]
          for path in paths:
            text = path.read_text()
            if 'donezo-shell-v25' not in text:
              raise SystemExit(f'missing v25 anchor in {path}')
            path.write_text(text.replace('donezo-shell-v25', 'donezo-shell-v26'))
          PY
      - name: Verify
        run: |
          npm ci
          npm test
          npm run check
          VITE_SUPABASE_URL=https://example.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_only npm run build
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js test/app-shell.test.mjs test/mobile-social-proof-polish.test.mjs test/final-social-polish.test.mjs test/pwa.test.mjs
          git commit -m 'chore: bump PWA shell to v26'
          git push origin HEAD:feat/flexible-weekly-habits-dark-mode-2026-08-31
