name: Apply searchable People profile

on:
  push:
    branches:
      - feat/searchable-people-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[people-profile-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_searchable_people_profile.py
      - run: npm ci
      - run: node --test test/searchable-people.test.mjs test/league-friends-ux.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified username and discovery profile
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm -f scripts/patch_searchable_people_profile.py .github/workflows/apply-searchable-people-profile.yml
          git add src/app.js social.css
          git commit -m "feat: add usernames and discovery profiles [people-profile-applied]"
          git push origin HEAD
