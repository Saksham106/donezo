name: Apply searchable People UI

on:
  push:
    branches:
      - feat/searchable-people-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[people-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_searchable_people_ui.py
      - run: python3 scripts/patch_searchable_people_ui_fixes.py
      - run: python3 scripts/patch_searchable_people_legacy_tests.py
      - run: npm ci
      - run: node --test test/searchable-people.test.mjs test/friends-foundation.test.mjs test/friends-ui.test.mjs test/league-friends-ux.test.mjs test/mobile-social-proof-polish.test.mjs test/mobile-social-v2.test.mjs test/fluid-performance.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified People UI
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm -f scripts/patch_searchable_people_ui.py scripts/patch_searchable_people_ui_fixes.py scripts/patch_searchable_people_legacy_tests.py .github/workflows/apply-searchable-people-ui.yml
          git add src/app.js social.css test/fluid-performance.test.mjs test/friends-ui.test.mjs test/mobile-social-v2.test.mjs
          git commit -m "feat: add searchable People experience [people-ui-applied]"
          git push origin HEAD
