name: Apply proof flow transform

on:
  push:
    branches: [feat/proof-review-viewer]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/proof-review-viewer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-proof-flow.mjs
      - run: node --check src/app.js
      - run: node --check src/proof.js
      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo "No product changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js social.css
          git commit -m "feat: add proof review and in-app viewer"
          git push origin HEAD:feat/proof-review-viewer
