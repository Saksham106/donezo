name: Apply dual proof UI

on:
  push:
    branches:
      - feat/dual-proof-full-feed-updates-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Correct guarded UI patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch_dual_ui.py')
          text = path.read_text()

          stale = '    "function settingsSheet() {",\n'
          fixed = '    "function inviteSheet() {",\n'
          if text.count(stale) != 1:
              raise SystemExit(f'expected one stale Updates end anchor, found {text.count(stale)}')
          text = text.replace(stale, fixed, 1)

          marker = '# Remove stale proof-viewer cleanup/state references.\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one viewer cleanup marker, found {text.count(marker)}')
          cleanup = r'''# Remove stale proof-viewer cleanup/state references.
          viewer_bindings = """  app.querySelectorAll('[data-proof-viewer-close]').forEach((element) => { element.onclick = () => { proofViewerRequestId += 1; proofViewer = null; render(); }; });
          app.querySelectorAll('[data-proof-viewer-retry]').forEach((element) => { element.onclick = loadProofViewerUrl; });
          const proofViewerImage = app.querySelector('[data-proof-viewer-image]');
          const expectedUrl = proofViewer?.url;
          proofViewerImage?.addEventListener('error', () => {
            if (!proofViewer || proofViewer?.url !== expectedUrl) return;
            proofViewer = { ...proofViewer, status: 'error', url: null, error: 'That signed proof link expired. Tap try again.' };
            render();
          });
          """
          if viewer_bindings not in text:
              raise SystemExit('missing proof viewer binding block')
          text = text.replace(viewer_bindings, '', 1)
          text = text.replace("  proofViewer = null;\n", "")
          text = text.replace("  proofViewerRequestId += 1;\n", "")
          '''
          text = text.replace(marker, cleanup, 1)
          path.write_text(text)
          PY
      - run: python3 scripts/patch_dual_ui.py
      - run: npm ci
      - run: node --test test/dual-proof-ui.test.mjs test/full-proof-feed.test.mjs test/updates-center.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified UI
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm .github/workflows/apply-dual-ui.yml scripts/patch_dual_ui.py
          git add src/app.js index.html social.css test/dual-proof-ui.test.mjs test/full-proof-feed.test.mjs test/updates-center.test.mjs
          git diff --cached --check
          git commit -m "feat: add dual proof feed and Updates UI"
          git push origin HEAD:feat/dual-proof-full-feed-updates-2026-09-02
