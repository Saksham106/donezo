name: Apply dual proof UI

on:
  push:
    branches:
      - feat/dual-proof-full-feed-updates-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Correct guarded UI patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch_dual_ui.py')
          text = path.read_text()

          stale = '    "function settingsSheet() {",\n'
          fixed = '    "function inviteSheet() {",\n'
          if text.count(stale) != 1:
              raise SystemExit(f'expected one stale Updates end anchor, found {text.count(stale)}')
          text = text.replace(stale, fixed, 1)

          marker = '# Remove stale proof-viewer cleanup/state references.\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one viewer cleanup marker, found {text.count(marker)}')
          cleanup = r'''# Remove stale proof-viewer cleanup/state references.
          viewer_start = "  app.querySelectorAll('[data-proof-viewer-close]')"
          viewer_end = "  bindProofThumbnails();"
          viewer_i = text.find(viewer_start)
          viewer_j = text.find(viewer_end, viewer_i)
          if viewer_i < 0 or viewer_j < 0:
              raise SystemExit('missing proof viewer binding boundaries')
          text = text[:viewer_i] + text[viewer_j:]
          text = text.replace("  proofViewer = null;\n", "")
          text = text.replace("  proofViewerRequestId += 1;\n", "")
          text = re.sub(r"\n\s*app\.querySelectorAll\('\[data-squad-feed\]'\)[^\n]*", "", text)
          '''
          text = text.replace(marker, cleanup, 1)
          path.write_text(text)
          PY
      - run: python3 scripts/patch_dual_ui.py
      - run: python3 scripts/patch_dual_legacy_tests.py
      - run: npm ci
      - run: node --test test/dual-proof-ui.test.mjs test/full-proof-feed.test.mjs test/updates-center.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified UI
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm .github/workflows/apply-dual-ui.yml scripts/patch_dual_ui.py scripts/patch_dual_legacy_tests.py
          git add src/app.js index.html social.css test/dual-proof-ui.test.mjs test/full-proof-feed.test.mjs test/updates-center.test.mjs test/app-shell.test.mjs test/fluid-performance.test.mjs test/friends-ui.test.mjs test/league-friends-ux.test.mjs test/mobile-polish-v2.test.mjs test/mobile-social-v2.test.mjs test/polish-batch.test.mjs
          git diff --cached --check
          git commit -m "feat: add dual proof feed and Updates UI"
          git push origin HEAD:feat/dual-proof-full-feed-updates-2026-09-02
