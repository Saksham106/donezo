name: Apply notification opt-in card

on:
  push:
    branches:
      - feat/notification-opt-in-card-2026-09-01

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notification-opt-in-card-2026-09-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply focused patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/notifications.js',
              "export function getNotificationCapability(env = globalThis) {\n  const NotificationApi = env.Notification;\n  const navigatorApi = env.navigator;\n  if (!NotificationApi || !navigatorApi?.serviceWorker) return { supported: false, permission: 'unsupported' };\n  return { supported: true, permission: NotificationApi.permission || 'default' };\n}\n",
              "export function getNotificationCapability(env = globalThis) {\n  const NotificationApi = env.Notification;\n  const navigatorApi = env.navigator;\n  if (!NotificationApi || !navigatorApi?.serviceWorker) return { supported: false, permission: 'unsupported' };\n  return { supported: true, permission: NotificationApi.permission || 'default' };\n}\n\nexport function shouldOfferNotificationPrompt(capability, dismissed = false) {\n  return Boolean(capability?.supported && capability.permission === 'default' && !dismissed);\n}\n",
          )

          replace_once(
              'src/app.js',
              "  sendTestNotification,\n  syncPushSubscription,\n} from './notifications.js';",
              "  sendTestNotification,\n  shouldOfferNotificationPrompt,\n  syncPushSubscription,\n} from './notifications.js';",
          )
          replace_once(
              'src/app.js',
              "const THEME_KEY = 'donezo.theme';",
              "const THEME_KEY = 'donezo.theme';\nconst NOTIFICATION_PROMPT_DISMISSED_KEY = 'donezo.notificationPromptDismissed';",
          )
          replace_once(
              'src/app.js',
              "function nav() {",
              "function notificationOptInBanner() {\n  const capability = getNotificationCapability(window);\n  const dismissed = localStorage.getItem(NOTIFICATION_PROMPT_DISMISSED_KEY) === '1';\n  if (tab !== 'today' || !shouldOfferNotificationPrompt(capability, dismissed)) return '';\n  return `<aside class=\"notification-opt-in-banner ${pwaUpdateAvailable ? 'stacked' : ''}\" role=\"status\"><div><strong>Get the useful nudges.</strong><small>Habit reminders and friend updates can reach you even when Donezo is closed.</small></div><div class=\"notification-opt-in-actions\"><button class=\"text-btn compact\" type=\"button\" data-dismiss-notification-prompt>Dismiss</button><button class=\"btn primary small-btn\" type=\"button\" data-enable-notifications>Enable</button></div></aside>`;\n}\n\nfunction nav() {",
          )
          replace_once(
              'src/app.js',
              "${pwaUpdateBanner()}${nav()}",
              "${pwaUpdateBanner()}${notificationOptInBanner()}${nav()}",
          )
          replace_once(
              'src/app.js',
              "  app.querySelectorAll('[data-apply-update]').forEach((element) => { element.onclick = handleApplyPwaUpdate; });",
              "  app.querySelectorAll('[data-apply-update]').forEach((element) => { element.onclick = handleApplyPwaUpdate; });\n  app.querySelectorAll('[data-enable-notifications]').forEach((element) => { element.onclick = handleNotifications; });\n  app.querySelectorAll('[data-dismiss-notification-prompt]').forEach((element) => { element.onclick = () => { localStorage.setItem(NOTIFICATION_PROMPT_DISMISSED_KEY, '1'); render(); }; });",
          )

          social = Path('social.css')
          css = social.read_text()
          addition = """\n.notification-opt-in-banner{position:fixed;right:var(--space-3);bottom:calc(3.95rem + var(--app-safe-bottom));left:var(--space-3);z-index:40;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-3);max-width:30rem;margin:auto;padding:var(--space-3);border:var(--rule-hairline) solid var(--color-rule-strong);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-ink);box-shadow:0 12px 28px var(--color-shadow)}.notification-opt-in-banner.stacked{bottom:calc(8.8rem + var(--app-safe-bottom))}.notification-opt-in-banner strong,.notification-opt-in-banner small{display:block}.notification-opt-in-banner small{margin-top:.12rem;color:var(--color-muted);font-size:var(--text-2xs);line-height:1.35}.notification-opt-in-actions{display:flex;align-items:center;gap:var(--space-2)}.notification-opt-in-actions .text-btn{min-height:2.2rem;margin:0;padding:.35rem .2rem;font-size:var(--text-xs)}@media(max-width:374px){.notification-opt-in-banner{grid-template-columns:1fr}.notification-opt-in-actions{justify-content:flex-end}.notification-opt-in-banner.stacked{bottom:calc(9.7rem + var(--app-safe-bottom))}}\n"""
          if '.notification-opt-in-banner{' in css:
              raise SystemExit('notification opt-in CSS already present')
          social.write_text(css + addition)
          PY
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/notifications.js src/app.js social.css
          git commit -m "feat: add Today notification opt-in card"
          git push origin HEAD:feat/notification-opt-in-card-2026-09-01
