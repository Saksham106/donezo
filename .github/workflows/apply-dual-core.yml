name: Apply dual proof repository core

on:
  push:
    branches:
      - feat/dual-proof-full-feed-updates-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'feat: support dual proof mode in repository') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch repository core
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/store.js')
          text = p.read_text()

          def replace(old, new, count=1):
              global text
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'expected {count} matches, found {found}: {old[:100]!r}')
              text = text.replace(old, new, count)

          replace("import { proofMimeType } from './proof.js';", "import { proofMimeType, requiresPhotoProof } from './proof.js';")
          replace("if (!['photo', 'none'].includes(proofMode)) throw new Error('Choose a valid proof mode');", "if (!['photo', 'dual_photo', 'none'].includes(proofMode)) throw new Error('Choose a valid proof mode');")
          replace("if (habit.proofMode === 'photo') throw new Error('Photo habits use the proof flow');", "if (requiresPhotoProof(habit.proofMode)) throw new Error('Photo habits use the proof flow');", count=2)

          replace(
              "const [notificationPreferencesResult, membershipsResult, friendshipsResult, requestsResult] = await Promise.all([",
              "const [notificationPreferencesResult, membershipsResult, friendshipsResult, requestsResult, userUpdateStateResult] = await Promise.all(["
          )
          replace(
              "      client.from('friend_requests').select('*').order('created_at', { ascending: false }),\n    ]);",
              "      client.from('friend_requests').select('*').order('created_at', { ascending: false }),\n      client.from('user_update_state').select('last_seen_at').eq('user_id', user.id).maybeSingle(),\n    ]);"
          )
          replace(
              "const firstError = [notificationPreferencesResult, membershipsResult, friendshipsResult, requestsResult].find((result) => result.error);",
              "const firstError = [notificationPreferencesResult, membershipsResult, friendshipsResult, requestsResult, userUpdateStateResult].find((result) => result.error);"
          )
          replace(
              "      notificationPreferences: notificationPreferencesResult.data,\n    });",
              "      notificationPreferences: notificationPreferencesResult.data,\n      userUpdateState: userUpdateStateResult.data,\n    });"
          )
          replace(
              "    notificationPreferences,\n  };",
              "    notificationPreferences,\n    updatesLastSeenAt: rows.userUpdateState?.last_seen_at || null,\n  };"
          )

          apply_nudge = """  function applyNudgeRead(nudgeId, readAt = new Date().toISOString()) {
    const nudge = (state.nudges || []).find((item) => item.id === nudgeId && item.toUserId === user.id);
    if (!nudge) return null;
    const previous = nudge.readAt || null;
    nudge.readAt = readAt;
    return previous;
  }
"""
          apply_updates = apply_nudge + """
  function applyUpdatesSeen(markedAt = new Date().toISOString()) {
    const value = String(markedAt || new Date().toISOString());
    state.updatesLastSeenAt = value;
    state.nudges = (state.nudges || []).map((nudge) => (
      nudge.toUserId === user.id && !nudge.readAt ? { ...nudge, readAt: value } : nudge
    ));
    return value;
  }
"""
          replace(apply_nudge, apply_updates)

          mark_nudge = """  async function markNudgeRead(nudgeId) {
    const readAt = new Date().toISOString();
    const { error } = await client.from('nudges').update({ read_at: readAt }).eq('id', nudgeId).eq('to_user_id', user.id);
    if (error) throw appError(error, 'Could not mark nudge read');
    return { id: nudgeId, readAt };
  }
"""
          mark_updates = mark_nudge + """
  async function markUpdatesSeen() {
    const { data, error } = await client.rpc('mark_updates_seen');
    if (error) throw appError(error, 'Could not mark Updates seen');
    return applyUpdatesSeen(data || new Date().toISOString());
  }
"""
          replace(mark_nudge, mark_updates)

          replace("    applyNudgeRead,\n", "    applyNudgeRead,\n    applyUpdatesSeen,\n")
          replace("    markNudgeRead,\n", "    markNudgeRead,\n    markUpdatesSeen,\n")

          p.write_text(text)
          PY
      - run: npm ci
      - run: node --test test/dual-proof-updates-migration.test.mjs test/dual-proof-mode.test.mjs test/dual-proof.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified core
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm .github/workflows/apply-dual-core.yml
          git add src/store.js src/proof.js src/dual-proof.js supabase/migrations/20260902_dual_photo_updates_state.sql test/dual-proof-updates-migration.test.mjs test/dual-proof-mode.test.mjs test/dual-proof.test.mjs
          git diff --cached --check
          git commit -m "feat: support dual proof mode in repository"
          git push origin HEAD:feat/dual-proof-full-feed-updates-2026-09-02
