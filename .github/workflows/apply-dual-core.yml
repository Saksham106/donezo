name: Apply dual proof core

on:
  push:
    branches:
      - feat/dual-proof-full-feed-updates-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_dual_core.py
      - run: npm ci
      - run: node --test test/dual-proof-updates-migration.test.mjs test/dual-proof-mode.test.mjs test/dual-proof.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified core
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm .github/workflows/apply-dual-core.yml scripts/patch_dual_core.py
          git add src/store.js src/proof.js src/dual-proof.js supabase/migrations/20260902_dual_photo_updates_state.sql test/dual-proof-updates-migration.test.mjs test/dual-proof-mode.test.mjs test/dual-proof.test.mjs
          git diff --cached --check
          git commit -m "feat: support dual proof mode in repository"
          git push origin HEAD:feat/dual-proof-full-feed-updates-2026-09-02
