name: Apply dual updates polish

on:
  push:
    branches:
      - fix/dual-updates-reactions-topbar-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_dual_updates_polish.py
      - run: npm ci
      - run: node --test test/dual-updates-polish.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified polish
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm -f .github/workflows/apply-dual-updates-polish.yml scripts/patch_dual_updates_polish.py
          git add src/app.js src/store.js social.css
          git diff --cached --check
          git commit -m "fix: polish dual proof and Updates UX"
          git push origin HEAD:fix/dual-updates-reactions-topbar-2026-09-02
