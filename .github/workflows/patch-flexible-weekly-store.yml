name: Patch flexible weekly store
on:
  push:
    paths:
      - '.github/workflows/patch-flexible-weekly-store.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flexible-weekly-habits-dark-mode-2026-08-31
      - name: Patch store
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/store.js')
          s = p.read_text()

          replacements = [
            (
              "      weekdays: version.schedule_weekdays || [],\n      targetQuantity: Number(version.target_quantity ?? 1),",
              "      weekdays: version.schedule_weekdays || [],\n      weeklyTargetDays: Number(version.weekly_target_days ?? 1),\n      targetQuantity: Number(version.target_quantity ?? 1),",
            ),
            (
              "      scheduleWeekdays: habit.schedule_weekdays || [],\n      targetQuantity: Number(habit.target_quantity ?? 1),",
              "      scheduleWeekdays: habit.schedule_weekdays || [],\n      weeklyTargetDays: Number(habit.weekly_target_days ?? 1),\n      targetQuantity: Number(habit.target_quantity ?? 1),",
            ),
            (
              "      weekdays: input.scheduleWeekdays || [],\n      targetQuantity: input.targetQuantity ?? 1,",
              "      weekdays: input.scheduleWeekdays || [],\n      weeklyTargetDays: input.weeklyTargetDays ?? 1,\n      targetQuantity: input.targetQuantity ?? 1,",
            ),
            (
              "      p_schedule_weekdays: schedule.weekdays,\n      p_target_quantity: schedule.targetQuantity,",
              "      p_schedule_weekdays: schedule.weekdays,\n      p_target_quantity: schedule.targetQuantity,",
            ),
          ]
          for old, new in replacements[:3]:
            if old not in s:
              raise SystemExit(f'missing store patch anchor: {old!r}')
            s = s.replace(old, new, 1)

          rpc_anchor = "      p_timezone: schedule.timezone,\n    });"
          if rpc_anchor not in s:
            raise SystemExit('missing RPC timezone anchor')
          s = s.replace(
            rpc_anchor,
            "      p_timezone: schedule.timezone,\n      p_weekly_target_days: schedule.weeklyTargetDays,\n    });",
            1,
          )
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/store.js
          git diff --cached --check
          git commit -m 'feat: persist flexible weekly schedule targets'
          git push origin HEAD:feat/flexible-weekly-habits-dark-mode-2026-08-31
