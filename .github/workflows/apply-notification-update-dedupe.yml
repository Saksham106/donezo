name: Apply notification update dedupe

on:
  push:
    branches:
      - fix/dual-updates-reactions-topbar-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_notification_update_dedupe.py
      - run: npm ci
      - run: node --test test/dual-updates-polish.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified dedupe
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm -f .github/workflows/apply-notification-update-dedupe.yml scripts/patch_notification_update_dedupe.py
          git add src/app.js src/store.js
          git diff --cached --check
          git commit -m "fix: preserve proof notifications in Updates"
          git push origin HEAD:fix/dual-updates-reactions-topbar-2026-09-02
