name: Apply People discovery rollback
on:
  push:
    branches: [feat/proof-friends-polish-2026-09-02]
    paths: [.github/workflows/apply-people-discovery-rollback.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/proof-friends-polish-2026-09-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_people_discovery_rollback.py
      - run: npm ci
      - run: node --test test/people-relationship-controls.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified rollback fix
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm scripts/patch_people_discovery_rollback.py .github/workflows/apply-people-discovery-rollback.yml
          git add src/app.js test/people-relationship-controls.test.mjs
          git commit -m "fix: restore People discovery state on failed relationship changes [people-rollback-applied]"
          git push origin HEAD:feat/proof-friends-polish-2026-09-02
