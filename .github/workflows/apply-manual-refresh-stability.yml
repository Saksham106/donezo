name: Apply manual refresh stability

on:
  push:
    branches:
      - fix/camera-friends-stability-2026-09-02

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: run guarded manual refresh stability patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_manual_refresh_stability.py
      - run: npm ci
      - run: node --test test/camera-friends-stability.test.mjs
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
      - name: Commit verified manual refresh fix
        run: |
          git config user.name "Saksham Goel"
          git config user.email "67731724+Saksham106@users.noreply.github.com"
          git rm -f scripts/patch_manual_refresh_stability.py .github/workflows/apply-manual-refresh-stability.yml
          git add src/app.js test/camera-friends-stability.test.mjs test/habit-ui.test.mjs
          git commit -m "fix: keep manual refresh scroll-stable"
          git push origin HEAD
