name: Finish flexible weekly and dark mode v2
on:
  push:
    paths:
      - '.github/workflows/finish-flexible-weekly-dark-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flexible-weekly-habits-dark-mode-2026-08-31
      - name: Reuse verified patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap
          source = Path('.github/workflows/finish-flexible-weekly-dark.yml').read_text()
          match = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY\n", source, re.S)
          if not match:
            raise SystemExit('could not extract finish patch')
          exec(compile(textwrap.dedent(match.group(1)), 'finish-flexible-weekly-dark', 'exec'))
          PY
      - name: Verify patch
        run: |
          npm ci
          npm test
          npm run check
          VITE_SUPABASE_URL=https://example.supabase.co VITE_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_only npm run build
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tokens.css src/app.js test/flexible-weekly-ui.test.mjs test/friends-ui.test.mjs
          git commit -m 'feat: redesign dark mode with warm graphite'
          git push origin HEAD:feat/flexible-weekly-habits-dark-mode-2026-08-31
